[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kigo-collect"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["requests", "pypdf", "PyYAML"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["tools"]

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tests"]
